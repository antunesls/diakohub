<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Inscrição — DiakoHub</title>
<link rel="stylesheet" href="/estilo.css?v=5">
<style>
  .inscricao-dados { text-align: center; color: var(--suave); margin: 0 0 8px; }
  .inscricao-descricao { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 24px; }
  .inscricao-vagas { text-align: center; font-weight: 600; margin: 0 0 24px; }
  .acompanhante { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linha); }
  .acompanhante input[type=text] { flex: 1 1 200px; }
  .acompanhante .marcar { margin: 0; }
  #mais-acompanhante { margin-top: 8px; }
</style>
</head>
<body class="publico"><main>
  <header><img src="/logo.png" alt="DiakoHub"></header>
  <p id="carregando" class="intro">Carregando…</p>

  <!-- Inscrição: /inscricao/<código> -->
  <section id="encontro" hidden>
    <p class="sobretitulo">Inscrição</p>
    <h1 id="titulo"></h1>
    <p class="inscricao-dados" id="quando"></p>
    <p class="inscricao-dados" id="local"></p>
    <p class="inscricao-descricao" id="descricao"></p>
    <p class="inscricao-vagas" id="vagas"></p>
    <p id="fechado" class="cartao erro" hidden></p>
    <form id="form" class="cartao" hidden>
      <div class="campo"><label for="nome">Seu nome</label><input id="nome" maxlength="120" autocomplete="name" required></div>
      <div class="campo"><label for="whatsapp">WhatsApp com DDD</label><input id="whatsapp" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="(11) 91234-5678" required></div>
      <div class="campo"><label for="email">E-mail <span class="dica">(opcional: para receber a confirmação e poder cancelar)</span></label><input id="email" type="email" maxlength="160" autocomplete="email"></div>
      <div class="campo">
        <span class="rotulo-campo"><strong>Quem vai com você</strong> <span class="dica">(opcional; todos ocupam vaga, inclusive crianças)</span></span>
        <div id="acompanhantes"></div>
        <button type="button" class="botao secundario pequeno" id="mais-acompanhante">+ Acompanhante</button>
      </div>
      <div class="campo" id="campo-pergunta" hidden><label for="resposta" id="pergunta"></label><textarea id="resposta" maxlength="500" rows="3"></textarea><span class="dica">Não informe dados de saúde nem documentos.</span></div>
      <div class="escondido" aria-hidden="true"><label for="website">Não preencha</label><input id="website" tabindex="-1" autocomplete="off"></div>
      <label class="marcar campo"><input type="checkbox" id="consentimento" required><span id="texto-consentimento"></span></label>
      <p id="erro" class="erro" role="alert" hidden></p>
      <button class="botao" id="enviar">Fazer inscrição</button>
    </form>
  </section>

  <section id="obrigado" class="cartao" hidden>
    <h2 id="obrigado-titulo"></h2>
    <p id="obrigado-texto"></p>
  </section>

  <!-- Cancelamento: /inscricao/cancelar?token=… (link do e-mail) -->
  <section id="cancelamento" class="cartao" hidden>
    <h2>Sua inscrição</h2>
    <p id="cancelamento-dados"></p>
    <p id="cancelamento-estado"></p>
    <p id="cancelamento-erro" class="erro" role="alert" hidden></p>
    <button class="botao perigo" id="cancelar" type="button" hidden>Cancelar minha inscrição</button>
  </section>

  <p id="nao-encontrado" class="cartao" hidden>Link de inscrição não encontrado. Confira o endereço ou fale com a equipe da igreja.</p>
</main>
<script src="/inscricao.js?v=1"></script>
</body></html>
