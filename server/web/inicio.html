<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igreja Diakonia Tulipas</title>
<meta name="description" content="Avisos, agenda, horários dos cultos e pedidos de oração.">
<meta name="theme-color" content="#f7f5f0">
<link rel="stylesheet" href="/estilo.css?v=5">
<style>
  .topo-site { background: var(--superficie); border-bottom: 1px solid var(--linha); }
  .topo-site .dentro { max-width: 1120px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .topo-site img { height: 40px; width: auto; display: block; }
  .topo-site nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; font-weight: 600; font-size: 15px; }
  .topo-site nav a { color: var(--texto); text-decoration: none; }
  .topo-site nav a:hover { color: var(--primaria); }
  /* Minha Escala: pílula verde (o verde "ok" do site, mais vivo que o da marca) para se destacar no menu. */
  .topo-site nav a.menu-escala { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 16px; border-radius: 19px;
    background: var(--ok); color: #fff; font-size: 14px; white-space: nowrap; }
  .topo-site nav a.menu-escala:hover { background: #236240; color: #fff; }
  .topo-site nav a.menu-escala:focus-visible { outline: 3px solid var(--primaria); outline-offset: 2px; }
  .topo-site nav a.menu-escala svg { width: 17px; height: 17px; flex: none; }
  .topo-site .espaco { flex: 1; }
  /* Aviso urgente: faixa cheia em laranja escuro, com selo, para não passar despercebida. */
  .urgente { background: #c2410c; color: #fff; }
  .urgente + .urgente { border-top: 1px solid rgba(255, 255, 255, .35); }
  .urgente .dentro { max-width: 1120px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .urgente .selo-urgente { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 8px; border-radius: 999px; background: #fff; color: #8a2d07;
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .urgente .selo-urgente svg { width: 15px; height: 15px; flex-shrink: 0; }
  .urgente p { flex: 1 1 260px; min-width: 0; margin: 0; font-size: 18px; line-height: 1.4; }
  .urgente p strong { font-weight: 700; }
  @media (max-width: 600px) { .urgente p { font-size: 16px; } }
  @media (prefers-reduced-motion: no-preference) {
    .urgente .selo-urgente { animation: piscar-urgente 2.4s ease-in-out infinite; }
    @keyframes piscar-urgente { 50% { opacity: .6; } }
  }
  .conteudo { max-width: 1120px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 28px; }
  .conteudo > .largura-toda { grid-column: 1 / -1; }
  .coluna { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  /* Destaque do dia: eventos de hoje (ou o próximo encontro, se hoje não tem nada). */
  .destaque { border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--primaria); color: #fff; }
  .destaque.proximo { background: var(--primaria-suave); color: var(--primaria-escura); }
  .destaque .rotulo { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #bfdcd7; }
  .destaque.proximo .rotulo { color: var(--primaria); }
  .destaque h2 { margin: 0; font-size: 26px; color: inherit; }
  .itens-dia { display: grid; gap: 12px; }
  .item-dia { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: center; padding: 16px 18px; border-radius: 16px; background: rgba(255, 255, 255, .1); }
  .destaque.proximo .item-dia { background: var(--superficie); }
  .item-dia .hora { font-family: var(--fonte-titulo); font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .item-dia .hora small { display: block; margin-top: 6px; font-family: var(--fonte); font-size: 13px; font-weight: 500; opacity: .8; }
  .item-dia .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .item-dia .info strong { font-size: 18px; overflow-wrap: anywhere; }
  .item-dia .info span { font-size: 14px; opacity: .85; }
  .item-dia .info .selo { align-self: flex-start; margin-top: 4px; padding: 2px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 1; background: rgba(255, 255, 255, .18); }
  .item-dia .info .selo.agora { background: #fff; color: var(--primaria-escura); }
  .selo.agora::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 4px; background: #2e9d63; vertical-align: 1px; }
  .destaque.proximo .item-dia .info .selo { background: var(--neutro); color: var(--texto); }
  .item-dia .botoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .destaque:not(.proximo) .botao.secundario { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .5); }
  .destaque:not(.proximo) .botao.secundario:hover { background: rgba(255, 255, 255, .12); }
  .destaque .botao.claro { background: #fff; color: var(--primaria-escura); }
  .destaque.proximo .botao.claro { background: var(--primaria); color: #fff; }
  @media (min-width: 700px) {
    .item-dia { grid-template-columns: 110px minmax(0, 1fr) auto; }
    .item-dia .botoes { grid-column: auto; margin-top: 0; justify-content: flex-end; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .selo.agora::before { animation: pulsar 2s ease-in-out infinite; }
    @keyframes pulsar { 50% { opacity: .35; } }
  }
  .mes { margin: 0; padding: 14px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--primaria); }
  .detalhes-pix summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--primaria); }
  .detalhes-pix[open] summary { margin-bottom: 6px; }
  section > h1, section > h2 { margin: 0 0 12px; }
  h1 { font-size: 30px; }
  h2 { font-size: 23px; }
  .avisos { display: grid; gap: 12px; }
  .aviso { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; overflow: hidden; }
  .aviso img { width: 100%; max-height: 320px; object-fit: cover; display: block; background: var(--neutro); }
  .aviso .texto { padding: 14px 18px; }
  .aviso strong { display: block; font-size: 17px; }
  .aviso p { margin: 4px 0 0; color: var(--suave); white-space: pre-line; }
  .aviso .ate { font-size: 13px; color: var(--suave); margin-top: 6px; }
  .cartaz-abrir { display: block; position: relative; color: var(--texto); cursor: zoom-in; }
  .cartaz-abrir:focus-visible { outline: 3px solid var(--primaria); outline-offset: -3px; }
  .cartaz-abrir span { position: absolute; right: 10px; bottom: 10px; padding: 5px 12px; border-radius: 16px; background: rgba(0, 0, 0, .75); color: #fff; font-size: 13px; }
  #visualizador-cartaz { width: calc(100vw - 24px); max-width: 1400px; height: calc(100dvh - 24px); max-height: none; padding: 0; border: 0; border-radius: 16px; background: var(--superficie); color: var(--texto); overflow: hidden; }
  #visualizador-cartaz[open] { display: flex; flex-direction: column; }
  #visualizador-cartaz::backdrop { background: rgba(0, 0, 0, .85); }
  .cartaz-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--linha); }
  .cartaz-barra h2 { flex: 1; min-width: 140px; margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  .cartaz-controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #cartaz-area { flex: 1; min-height: 0; overflow: auto; background: #171717; padding: 16px; }
  #cartaz-completo { display: block; max-width: none; height: auto; margin: 0 auto; }
  #cartaz-completo[hidden] { display: none; }
  #cartaz-estado { margin: 0; padding: 6px 16px; font-size: 14px; }
  #cartaz-estado:empty { display: none; }
  .acoes-site { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .acao { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; row-gap: 2px; align-items: center; padding: 16px 18px; border-radius: 18px; text-decoration: none; background: var(--superficie); border: 1px solid var(--linha); color: var(--texto); }
  .acao.principal { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  .acao strong { font-size: 17px; }
  .acao span { font-size: 14px; color: var(--suave); }
  .acao.principal span { color: #d6e8e5; }
  .acao:hover { border-color: var(--borda); }
  .icone-acao { grid-row: span 2; width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--primaria-suave); }
  .acao.principal .icone-acao { background: rgba(255, 255, 255, .16); }
  .icone-acao svg { width: 26px; height: 26px; }
  .acao.principal:hover { background: var(--primaria-escura); color: #fff; }
  .lista { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; padding: 4px 18px; }
  .evento { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .evento:last-child { border-bottom: 0; }
  .data { width: 48px; flex-shrink: 0; text-align: center; padding: 4px 0; border-radius: 10px; background: var(--neutro); font-size: 12px; font-weight: 600; line-height: 1.2; text-transform: uppercase; }
  .data b { display: block; font-size: 19px; }
  .data.hoje { background: var(--primaria-suave); color: var(--primaria-escura); }
  .evento .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .evento .info span { font-size: 14px; color: var(--suave); }
  .evento a { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .caixa { background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .caixa h2 { margin: 0; font-size: 21px; }
  /* Agenda da igreja no celular (assinatura que fica sincronizada). */
  .agenda-celular .titulo-icone { display: flex; align-items: center; gap: 12px; }
  .agenda-celular .titulo-icone .icone-acao { grid-row: auto; flex: none; }
  .agenda-celular p { margin: 0; font-size: 15px; color: var(--suave); }
  .agenda-celular .botao { width: 100%; }
  .agenda-celular .outras { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; font-weight: 600; }
  .agenda-celular .outras a, .agenda-celular .outras button { color: var(--primaria); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .agenda-celular textarea { min-height: 0; font: 13px/1.4 ui-monospace, monospace; }
  /* Devocional da semana: faixa de largura total, logo abaixo dos atalhos. */
  .devocional-semana { display: grid; gap: 12px 24px; align-items: end; }
  .devocional-semana .devocional-conteudo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .devocional-semana .sobretitulo { margin: 0; }
  .devocional-semana h2 { margin: 0; font-size: 24px; }
  .devocional-semana p { margin: 0; line-height: 1.55; max-width: 78ch; }
  .devocional-semana .referencia { font-family: var(--fonte-titulo); font-style: italic; color: var(--primaria-escura); }
  .devocional-semana .acoes-devocional { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  @media (min-width: 760px) {
    .devocional-semana { grid-template-columns: minmax(0, 1fr) auto; }
    .devocional-semana .acoes-devocional { justify-content: flex-end; }
  }
  .par { display: flex; justify-content: space-between; gap: 12px; }
  .endereco { color: var(--suave); padding-top: 10px; border-top: 1px solid var(--linha); white-space: pre-line; }
  .pix { display: flex; gap: 16px; align-items: center; }
  .pix img { width: 120px; height: 120px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--linha); background: #fff; }
  .passos-pix { margin: 0; padding-left: 20px; color: var(--suave); font-size: 14px; line-height: 1.6; }
  .passos-pix strong { color: var(--texto); }
  #contribuir textarea { min-height: 0; font-family: ui-monospace, monospace; font-size: 13px; }
  .pix { padding-top: 12px; border-top: 1px solid var(--linha); }
  .pix code { display: block; padding: 8px 10px; border-radius: 10px; background: var(--neutro); font-size: 14px; overflow-wrap: anywhere; margin: 6px 0 10px; }
  .rodape-site { max-width: 1120px; margin: 0 auto; padding: 8px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--suave); font-size: 14px; }
  .rodape-site .equipe { color: var(--suave); }
  .faixa-redes { background: var(--primaria); color: #fff; }
  .faixa-redes .dentro { max-width: 1120px; margin: 0 auto; padding: 36px 20px 26px; display: flex; flex-direction: column; gap: 16px; }
  .faixa-redes h2 { margin: 0; color: #fff; font-size: 27px; }
  .faixa-redes p { margin: 0; color: #d6e8e5; font-size: 16px; }
  .botoes-redes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .rede { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 22px; border-radius: 30px; background: #fff; color: var(--texto); text-decoration: none; border: 1px solid #fff; }
  .rede strong { display: block; font-size: 16px; }
  .rede small { display: block; font-size: 13px; color: var(--suave); }
  .rede.contorno { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .45); color: #fff; }
  .rede.contorno small { color: #d6e8e5; }
  .rede:hover { color: var(--texto); box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }
  .rede.contorno:hover { color: #fff; }
  .rede:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .assinatura { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; padding-top: 8px; font-size: 14px; color: #d6e8e5; }
  .assinatura .equipe { color: #fff; }
  /* Link discreto para o cadastro de membros, junto da assinatura. */
  .botao-membro { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 14px; border: 1px solid var(--linha); color: var(--suave); font-size: 13px; text-decoration: none; }
  .botao-membro:hover { color: var(--primaria); border-color: var(--borda); }
  .botao-membro svg { width: 14px; height: 14px; }
  .assinatura .botao-membro { color: #d6e8e5; border-color: rgba(255, 255, 255, .35); }
  .assinatura .botao-membro:hover { color: #fff; border-color: rgba(255, 255, 255, .7); }
  @media (min-width: 960px) { .faixa-redes .dentro { padding: 44px 20px 30px; } .faixa-redes h2 { font-size: 34px; } }
  .carregando { text-align: center; color: var(--suave); padding: 48px 0; }
  /* Carrossel de fotos (capa) */
  .capa { max-width: 1120px; margin: 24px auto 0; padding: 0 20px; }
  .capa .moldura { position: relative; border-radius: 20px; overflow: hidden; background: var(--neutro); }
  .trilho { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 3; outline: none; }
  .trilho::-webkit-scrollbar { display: none; }
  .trilho:focus-visible { box-shadow: inset 0 0 0 3px var(--primaria); }
  .slide { flex: 0 0 100%; margin: 0; position: relative; scroll-snap-align: start; }
  .slide a, .slide img { display: block; width: 100%; height: 100%; }
  .slide img { object-fit: cover; }
  .slide figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 38px; background: rgba(28, 27, 25, .62); color: #fff; font-weight: 600; font-size: 16px; }
  .capa.uma .slide figcaption { padding-bottom: 12px; }
  .pontos { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 2px; }
  .pontos button { width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pontos button::before { content: ''; width: 9px; height: 9px; border-radius: 5px; background: rgba(255, 255, 255, .6); transition: width .2s; }
  .pontos button[aria-current="true"]::before { width: 22px; background: #fff; }
  .seta { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 23px; border: 0; background: rgba(255, 255, 255, .9); color: var(--texto); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .seta:hover { background: #fff; }
  .seta.anterior { left: 14px; }
  .seta.proxima { right: 14px; }
  /* 16:9 até 540 px de altura (altura calculada: aspect-ratio + max-height estreitaria o trilho). */
  @media (min-width: 700px) { .trilho { aspect-ratio: auto; height: min(540px, calc((100vw - 40px) * 9 / 16)); } }
  @media (max-width: 600px) { .seta { display: none; } .capa { margin-top: 14px; padding: 0 16px; } }
  @media (prefers-reduced-motion: reduce) { .trilho { scroll-behavior: auto; } .pontos button::before { transition: none; } }
  @media (min-width: 960px) {
    .conteudo { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px 32px; align-items: start; }
    .avisos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .aviso.com-imagem { grid-row: span 2; }
    .destaque { padding: 26px 30px; }
    .destaque h2 { font-size: 30px; }
    .itens-dia.varios { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .itens-dia.varios .item-dia { grid-template-columns: auto minmax(0, 1fr); }
    .itens-dia.varios .botoes { grid-column: 1 / -1; justify-content: flex-start; margin-top: 10px; }
    h1 { font-size: 34px; }
  }
  @media (max-width: 600px) {
    .topo-site nav { order: 3; width: 100%; justify-content: center; }
    .topo-site .dentro { justify-content: space-between; gap: 12px; }
    .topo-site img { height: 34px; }
    .topo-site .espaco { display: none; }
  }
</style>
</head>
<body>
<header class="topo-site">
  <div class="dentro">
    <a href="/" aria-label="Página inicial"><img src="/logo.png" alt="Igreja Diakonia Tulipas"></a>
    <span class="espaco"></span>
    <nav aria-label="Acessos e seções" id="menu-site"></nav>
    <a class="botao secundario pequeno" href="/painel">Área da equipe</a>
  </div>
</header>
<div id="urgentes"></div>
<section class="capa" id="capa" aria-roledescription="carrossel" aria-label="Fotos da igreja" hidden></section>

<main class="conteudo" id="conteudo">
  <p class="carregando largura-toda" id="carregando">Carregando…</p>
  <section class="largura-toda" id="avisos" aria-labelledby="avisos-t" hidden></section>
  <section class="destaque largura-toda" id="hoje" aria-labelledby="hoje-t" hidden></section>
  <nav class="acoes-site largura-toda" id="atalhos" aria-label="Fale com a igreja" hidden></nav>
  <section class="largura-toda caixa devocional-semana" id="devocional" aria-labelledby="devocional-t" hidden></section>
  <div class="coluna" id="principal" hidden></div>
  <aside class="coluna" id="lateral" hidden></aside>
</main>
<section class="faixa-redes" id="redes" aria-labelledby="redes-t" hidden></section>
<footer class="rodape-site" id="rodape" hidden></footer>

<dialog id="visualizador-cartaz" aria-labelledby="cartaz-titulo">
  <div class="cartaz-barra">
    <h2 id="cartaz-titulo">Cartaz</h2>
    <div class="cartaz-controles" role="group" aria-label="Zoom do cartaz">
      <button type="button" class="botao secundario pequeno" id="cartaz-reduzir" aria-label="Reduzir cartaz">−</button>
      <output id="cartaz-zoom" aria-live="polite" aria-label="Nível de zoom">100%</output>
      <button type="button" class="botao secundario pequeno" id="cartaz-ampliar" aria-label="Ampliar cartaz">+</button>
      <button type="button" class="botao secundario pequeno" id="cartaz-ajustar">Ajustar à tela</button>
    </div>
    <button type="button" class="botao pequeno" id="cartaz-fechar" autofocus>Fechar</button>
  </div>
  <p id="cartaz-estado" role="status"></p>
  <div id="cartaz-area" tabindex="0" role="region" aria-label="Cartaz completo. Após ampliar, role para ver os detalhes.">
    <img id="cartaz-completo" alt="">
  </div>
</dialog>

<script>
  'use strict';
  /** Cria elementos sem innerHTML (o conteúdo vem do painel). */
  function el(tag, props = {}, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos.flat()) if (f !== null && f !== undefined && f !== false) e.append(f);
    return e;
  }
  const $ = (id) => document.getElementById(id);
  const svg = (caminho, cor = 'currentColor') => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('width', '22'); s.setAttribute('height', '22'); s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.style.stroke = cor; s.setAttribute('stroke-width', '2');

    if (diaIso(new Date(ini)) !== diaIso(new Date())) return null;

        });
        return el('figure', { class: 'slide', role: 'group', 'aria-roledescription': 'foto', 'aria-label': (i + 1) + ' de ' + fotos.length },
          f.link ? el('a', { href: f.link, target: '_blank', rel: 'noopener' }, imagem) : imagem,
          f.legenda ? el('figcaption', {}, f.legenda) : null);
      }));
    const atual = () => Math.round(trilho.scrollLeft / Math.max(trilho.clientWidth, 1));
    const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ir = (i) => trilho.scrollTo({ left: ((i + fotos.length) % fotos.length) * trilho.clientWidth, behavior: reduzido ? 'auto' : 'smooth' });
    const pontos = fotos.map((_, i) => el('button', { type: 'button', 'aria-label': 'Ver foto ' + (i + 1) + ' de ' + fotos.length, onclick: () => ir(i) }));
    const marcar = () => pontos.forEach((b, i) => b.setAttribute('aria-current', String(i === atual())));
    let espera;
    trilho.addEventListener('scroll', () => {
      clearTimeout(espera);
      espera = setTimeout(marcar, 80);
    });
    trilho.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') ir(atual() + 1);
      else if (e.key === 'ArrowLeft') ir(atual() - 1);
      else return;
      e.preventDefault();
    });
    const varias = fotos.length > 1;
    capa.classList.toggle('uma', !varias);
    capa.replaceChildren(el('div', { class: 'moldura' }, trilho,
      varias ? el('button', { class: 'seta anterior', type: 'button', 'aria-label': 'Foto anterior', onclick: () => ir(atual() - 1) },
        svg('<path d="M15 6l-6 6 6 6"></path>')) : null,
      varias ? el('button', { class: 'seta proxima', type: 'button', 'aria-label': 'Próxima foto', onclick: () => ir(atual() + 1) },
        svg('<path d="M9 6l6 6-6 6"></path>')) : null,
      varias ? el('div', { class: 'pontos' }, pontos) : null));
    capa.hidden = false;
    marcar();

    // Passa sozinho, mas para enquanto a pessoa interage (mouse, dedo ou teclado) ou com a aba escondida.
    if (!varias || reduzido) return;
    let pausado = false;
    let retomar;
    const pausar = () => (pausado = true);
    const continuar = () => (pausado = false);
    capa.addEventListener('mouseenter', pausar);
    capa.addEventListener('mouseleave', continuar);
    capa.addEventListener('focusin', pausar);
    capa.addEventListener('focusout', continuar);
    capa.addEventListener('touchstart', () => {
      pausar();
      clearTimeout(retomar);
      retomar = setTimeout(continuar, 10000);
    }, { passive: true });
    setInterval(() => {
      if (!pausado && !document.hidden) ir(atual() + 1);
    }, 6000);
  }

  /** "@perfil" a partir do link (instagram.com/perfil ou youtube.com/@perfil). */
  function perfil(url, rede) {
    try {
      const primeiro = new URL(url).pathname.split('/').filter(Boolean)[0] || '';
      if (rede === 'instagram' && primeiro && !['p', 'reel', 'reels', 'stories', 'explore'].includes(primeiro)) return '@' + primeiro;
      if (rede === 'youtube' && primeiro.startsWith('@')) return primeiro;
    } catch {
      // link fora do padrão: mostra só o nome da rede
    }
    return '';
  }

  function botaoRede(url, titulo, detalhe, icone, cor, contorno = false) {
    return el('a', { class: 'rede' + (contorno ? ' contorno' : ''), href: url, target: '_blank', rel: 'noopener' },
      svg(icone, cor), el('span', {}, el('strong', {}, titulo), detalhe ? el('small', {}, detalhe) : null));
  }

  fetch('/api/public/inicio')
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(montar)
    .catch(() => {
      $('carregando').replaceChildren('Não foi possível carregar agora. ',
        el('a', { href: '/oracao' }, 'Fazer um pedido de oração'), ' · ', el('a', { href: '/mensagens' }, 'Falar com a igreja'));
    });
</script>
</body>
